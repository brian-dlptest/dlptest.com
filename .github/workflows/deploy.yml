name: Build & Deploy

# Branch → environment mapping:
#   push to staging  → deploys dlptest-com-staging Worker  (→ staging.dlptest.com)
#   push to main     → deploys dlptest-com-prod Worker     (→ dlptest.com)
#
# Pull requests against either branch run typecheck + build as a status
# check, but do not deploy. Use that signal to gate merges.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Serialize deploys per branch so a fast follow-up push can't race ahead of
# the previous build and overwrite newer code with older code. Different
# branches deploy to different Workers, so they may run concurrently.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # PR validation — typecheck + build only, no deploy
  # ---------------------------------------------------------------------
  validate:
    name: Typecheck & build (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build (production target)
        run: npm run build
        env:
          PUBLIC_SUBSCRIBE_API_URL: ${{ secrets.PUBLIC_SUBSCRIBE_API_URL }}
          PUBLIC_SUBSCRIBE_API_KEY: ${{ secrets.PUBLIC_SUBSCRIBE_API_KEY }}

  # ---------------------------------------------------------------------
  # Staging deploy — runs on push to `staging`
  # ---------------------------------------------------------------------
  staging:
    name: Deploy → dlptest-com-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: staging
      url: https://dlptest-com-staging.hileman8.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build (staging)
        run: npm run build:staging
        env:
          PUBLIC_SUBSCRIBE_API_URL: ${{ secrets.PUBLIC_SUBSCRIBE_API_URL }}
          PUBLIC_SUBSCRIBE_API_KEY: ${{ secrets.PUBLIC_SUBSCRIBE_API_KEY }}
      - name: Deploy
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # ---------------------------------------------------------------------
  # Production deploy — runs on push to `main`
  # ---------------------------------------------------------------------
  production:
    name: Deploy → dlptest-com-prod
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://dlptest-com-prod.hileman8.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build (production)
        run: npm run build
        env:
          PUBLIC_SUBSCRIBE_API_URL: ${{ secrets.PUBLIC_SUBSCRIBE_API_URL }}
          PUBLIC_SUBSCRIBE_API_KEY: ${{ secrets.PUBLIC_SUBSCRIBE_API_KEY }}
      - name: Deploy
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
