name: Secret expiry reminder

# Reads .github/secret-expiry.json weekly and opens a GitHub issue (label:
# secret-rotation) for any secret within `leadTimeDays` of its expiry — so a
# token never silently lapses. De-dupes against existing open issues, so you
# get one nag per secret per cycle. Update the `expires` date in the manifest
# after you rotate, then close the issue.
#
# Run it by hand any time from the Actions tab (workflow_dispatch); use
# `dryRun: true` there to preview matches in the log without opening issues.

on:
  schedule:
    # Mondays at 14:00 UTC.
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Log what would be opened without creating issues"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: secret-expiry-reminder
  cancel-in-progress: false

jobs:
  check:
    name: Check secret expiries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");

            const manifest = JSON.parse(
              fs.readFileSync(".github/secret-expiry.json", "utf8"),
            );
            const leadTimeDays = Number(manifest.leadTimeDays) || 30;
            const dryRun = context.payload?.inputs?.dryRun === "true";

            const LABEL = "secret-rotation";
            const MS_PER_DAY = 24 * 60 * 60 * 1000;
            const now = new Date();

            // Existing open rotation issues, to avoid duplicates.
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: LABEL },
            );

            let opened = 0;
            for (const secret of manifest.secrets || []) {
              if (!secret.expires) continue; // inventory-only entry

              const expiry = new Date(secret.expires + "T00:00:00Z");
              if (Number.isNaN(expiry.getTime())) {
                core.warning(`Skipping ${secret.name}: invalid expires "${secret.expires}"`);
                continue;
              }

              const daysLeft = Math.ceil((expiry.getTime() - now.getTime()) / MS_PER_DAY);
              if (daysLeft > leadTimeDays) {
                core.info(`${secret.name}: ${daysLeft}d left — outside ${leadTimeDays}d window, skipping.`);
                continue;
              }

              // One open issue per secret per cycle: match by a stable marker.
              const marker = `<!-- secret-rotation:${secret.name} -->`;
              const dup = existing.find((i) => (i.body || "").includes(marker));
              if (dup) {
                core.info(`${secret.name}: open issue #${dup.number} already exists, skipping.`);
                continue;
              }

              const overdue = daysLeft < 0;
              const title = overdue
                ? `🔴 Secret expired: ${secret.name} (${secret.expires})`
                : `🔑 Rotate secret: ${secret.name} (expires ${secret.expires}, ${daysLeft}d)`;

              const locations = (secret.locations || []).map((l) => `- ${l}`).join("\n");
              const body = [
                marker,
                overdue
                  ? `**\`${secret.name}\` has expired (${secret.expires}).** Whatever it powers is likely broken — rotate now.`
                  : `**\`${secret.name}\` expires in ${daysLeft} day(s)** (${secret.expires}). Rotate it before then.`,
                "",
                `**Type:** ${secret.type || "—"}`,
                "",
                "**Lives in:**",
                locations || "- —",
                "",
                "**How to rotate:**",
                secret.rotate || "—",
                "",
                "---",
                "After rotating, update the `expires` date for this secret in `.github/secret-expiry.json` and close this issue.",
                "",
                "_Opened automatically by the Secret expiry reminder workflow._",
              ].join("\n");

              if (dryRun) {
                core.info(`[dry-run] would open: ${title}`);
                continue;
              }

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [LABEL],
              });
              opened++;
              core.info(`Opened rotation issue for ${secret.name}.`);
            }

            core.info(dryRun ? "Dry run complete." : `Done. Opened ${opened} issue(s).`);
