name: News discovery (Claude → review queue)

# Daily Claude pass: searches for industry stories newer than the newest news
# pubDate, drafts Markdown candidate posts, and POSTs them to the site's review
# queue (/api/news/candidates). No pull requests are opened — candidates wait in
# D1 for a human Publish/Delete decision on /admin/news (behind Cloudflare
# Access). The ingest endpoint sends a single digest email when new stories land.
#
# Requires (GitHub Actions secrets):
#   ANTHROPIC_API_KEY   — Claude API key (https://console.anthropic.com)
#   NEWS_INGEST_SECRET  — must match the wrangler secret of the same name on the
#                         Worker; authorizes POSTs to the ingest endpoint.
# Optional:
#   NEWS_SITE_URL var   — defaults to https://dlptest.com
#   NEWS_MODEL var      — defaults to claude-sonnet-5 (see discover.mjs). Bump
#                         this var (not the code) when moving to a newer Claude
#                         generation, after checking Anthropic's migration notes.
#
# Security note: this workflow runs on `schedule` / `workflow_dispatch` only —
# NEVER add a `pull_request` trigger, or fork PRs could run it with these
# secrets.

on:
  schedule:
    # Daily 15:00 UTC (~10am Eastern). Adjust cron as needed.
    - cron: "0 15 * * *"
  workflow_dispatch:

concurrency:
  group: news-discovery-${{ github.repository }}
  cancel-in-progress: false

jobs:
  discover:
    name: Claude → review queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Discover and queue candidate posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_INGEST_SECRET: ${{ secrets.NEWS_INGEST_SECRET }}
          NEWS_SITE_URL: ${{ vars.NEWS_SITE_URL || 'https://dlptest.com' }}
          NEWS_MODEL: ${{ vars.NEWS_MODEL }}
        run: node scripts/news/discover.mjs
